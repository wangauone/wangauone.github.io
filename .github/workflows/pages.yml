# Builds the Hexo site and publishes it to GitHub Pages.
# Based on https://hexo.io/docs/github-pages with these changes:
# - newer major versions of each action
# - Node version read from .nvmrc
# - npm ci (exact versions from package-lock.json) with setup-node's npm cache
# - manual runs and a concurrency guard, as in GitHub's own Pages workflows
# - pull requests (e.g. Dependabot updates) are built but not deployed
# Requires Settings > Pages > Source = "GitHub Actions".
name: Pages

on:
  push:
    branches:
      - main # default branch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One queue per branch: a deployment that has started finishes before the
# next one runs, and pull request builds don't wait behind deployments.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the build never pushes
          fetch-depth: 0 # full history: tools/restore-mtime.js reads last-commit times
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
